# Второй агент для подвыборки на переносимость (решение 2026-09-17).
#
# Другая семья моделей при том же размере: нужно проверить, не привязаны ли
# метки N1 и D5 к особенностям Qwen — они определены через C1, то есть буквально
# через вопрос «справился бы ЭТОТ агент».
#
# Hermes-3 дообучен ровно под тот формат вызова инструментов, который уже
# настроен на сервере (--tool-call-parser hermes), поэтому обвязку менять не
# нужно. Запускается по очереди с основным агентом: две модели в 8 ГБ не влезут.
#
#   MODEL=NousResearch/Hermes-3-Llama-3.1-8B-AWQ scripts/serve_agent.sh
#   uv run python scripts/run_env.py --scenario elicit_pressure --seed 1 --agent configs/agent_hermes.toml
#
# ПЕРЕД СБОРОМ проверить тем же порядком, что и Qwen: тестовый вызов инструмента,
# стресс-тест длинным промптом, отчёт vLLM о размере KV-кэша. fp8 KV-кэш не
# включать: на Qwen он давал формально валидный, но полностью мусорный вывод.

kind = "openai"
model = "NousResearch/Hermes-3-Llama-3.1-8B-AWQ"
base_url = "http://localhost:8000/v1"

[sampling]
# Значения из рекомендаций Llama-3.1; проверить на первом же прогоне, что нет
# вырожденных повторов, как было у Qwen при repetition_penalty = 1.0.
temperature = 0.7
top_p = 0.9
top_k = 40
repetition_penalty = 1.05
max_tokens = 1024
