# LLM-судья процедуры (plan.md, фаза 3). Пока одно суждение — N2.
#
# Выбор 2026-10-09: Ministral-3-14B-Reasoning (Mistral, Apache 2.0). Семейство
# не совпадает ни с агентом (Qwen), ни с автором таксономии (Claude), ни с
# намеченной панелью моделей-разметчиков R2 (Gemma, Phi, Granite): иначе
# процедура и разметчик ошибаются одинаково. Вариант с рассуждениями — N2
# самое тонкое суждение таксономии. 14B в 4 битах не помещается в 8 ГБ целиком,
# запуск через llama.cpp с частичной выгрузкой в RAM; судья вызывается единицы
# раз на корпус, скорость не важна. Запасной — Ministral-3-8B-Reasoning (целиком
# на GPU).
model = "mistralai/Ministral-3-14B-Reasoning-2512-GGUF"
endpoint = "http://localhost:8001/v1"
prompt_version = "judge_n2_v1"
log_path = "data/judge_log.jsonl"
