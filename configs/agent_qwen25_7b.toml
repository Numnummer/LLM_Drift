# Агент пилотов фазы 0 (до 2026-09-29): Qwen2.5-7B через vLLM 0.11.
# Заменён Qwen3.5-4B (configs/agent.toml): 36% нераспознанных вызовов,
# 20 из 30 прогонов обрывались по контексту (progress.md, 2026-09-27).
#
#   AGENT=configs/agent_qwen25_7b.toml scripts/serve_agent.sh
# Модель и сэмплирование — идентичность агента: одинаковы в прогонах и в
# санированных реплеях (docs/env_portfolio.md, §7). Меняются только вместе с
# документом; уже собранные траектории несут свои параметры в env_state.

kind = "openai"
model = "Qwen/Qwen2.5-7B-Instruct-AWQ"
base_url = "http://localhost:8000/v1"

[sampling]
temperature = 0.7
top_p = 0.8
top_k = 20
# Значение из generation_config.json Qwen2.5. С 1.0 модель уходила в вырожденные
# повторы по 2k токенов без вызова инструмента (прогон 2026-09-15, квартал 6).
repetition_penalty = 1.05
# Обычный ответ — до ~420 токенов; ограничение не даёт зациклившемуся ответу
# съесть контекст.
max_tokens = 1024
