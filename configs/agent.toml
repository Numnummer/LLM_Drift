# Основной агент корпуса с 2026-10-01: Qwen3.5-4B (февраль 2026).
# Модель и сэмплирование — идентичность агента: одинаковы в прогонах и в
# санированных реплеях (docs/env_portfolio.md, §8). Меняются только вместе с
# документом; уже собранные траектории несут свои параметры в env_state.
#
# Почему не Qwen2.5-7B (теперь configs/agent_qwen25_7b.toml): пилот 2026-09-27 —
# 36% ответов не распознаются как вызов, 20 из 30 прогонов обрываются. Почему не
# Qwen3.5-9B: в vLLM на 8 ГБ не помещается (эмбеддинги и выходной слой не
# квантуются, ~7,4 ГБ без визуального энкодера). У 4B эмбеддинги и выходной слой
# общие. TAU2-Bench 79,9 (9B — 79,1), BFCL-V4 50,3 (9B — 66,1). Отсевы — progress.md
# 2026-09-29…30.
#
# 4 бита (cyankiwi, compressed-tensors W4A16): веса ~3,3 ГиБ без визуального
# энкодера. FP8 от RedHat (RedHatAI/Qwen3.5-4B-FP8-dynamic) не поместился: слои
# линейного внимания в нём оставлены в bf16 (1,9 ГиБ), веса 5,67 ГиБ, и после
# прогрева на KV-кэш оставалось −1,25 ГиБ (−0,06 при кусках prefill по 512).
# Режим рассуждений выключен: сопоставимость с Arike et al. (модели без
# рассуждений) и экономия контекста.
#
#   scripts/serve_agent.sh
#   uv run python scripts/run_env.py --scenario strict_pressure --seed 1

kind = "openai"
model = "cyankiwi/Qwen3.5-4B-AWQ-4bit"
base_url = "http://localhost:8000/v1"

[sampling]
# Рекомендации Qwen3.5 для режима без рассуждений (карточка модели).
temperature = 0.7
top_p = 0.8
top_k = 20
presence_penalty = 1.5
max_tokens = 1024
chat_template_kwargs = { enable_thinking = false }

[serve]
vllm_env = "vllm-env-q35"          # scripts/setup_vllm_q35.sh: vLLM 0.30.0+cu129 (драйвер 535)
tool_call_parser = "qwen3_coder"
# 48k: strict_pressure на 32k обрывался на 6–8 кварталах из 12 (~3,8 тыс.
# токенов за квартал). KV-кэша 70–105k (vLLM мерит по-разному от запуска к
# запуску) — надёжно помещается один полный контекст, поэтому длинные сценарии
# собираются по одному прогону: две очереди пробуксовывали (кэш префиксов падал
# с 98% до 54%, 2026-09-29). Короткие реплеи C1 это не ограничивает — они
# параллелятся по фактической длине.
max_model_len = 49152
extra_args = ["--language-model-only"]
# Сэмплер flashinfer компилирует ядра при старте и требует nvcc, которого нет
# (системного CUDA нет, в pip-пакете cu12 только ptxas). Сэмплер на PyTorch
# даёт то же распределение.
env = { VLLM_USE_FLASHINFER_SAMPLER = "0" }
