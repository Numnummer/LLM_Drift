[project]
name = "goal-drift-taxonomy"
version = "0.1.0"
description = "Формализация типов дрейфа целей в LLM-агентах (ИТМО / AlmetTech, задача 1)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
embeddings = ["sentence-transformers>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taxonomy"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
